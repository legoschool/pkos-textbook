<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="파이썬 자료변환기를 설치부터 변환·결과 읽기·코드로 쓰기까지 실제 실행 화면으로 따라 하는 15블록 실습 교재">
<title>자료변환기 실습 교재</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#e9edf1; --card:#ffffff; --card2:#f5f7f9; --ink:#141c26; --ink2:#465262; --ink3:#77828f;
  --line:#141c26; --soft:#d5dbe2;
  --blue:#2d5bd6; --blue-bg:#e3eafb; --yellow:#f3bf1a; --yellow-bg:#fdf3cf;
  --green:#23915a; --green-bg:#dcf1e5; --red:#dd4637; --red-bg:#fbe3e0;
  --code-bg:#121820; --code-ink:#e6edf3; --code-dim:#8b98a7;
  --shadow:4px 4px 0 var(--line); --shadow-sm:3px 3px 0 var(--line);
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  --mono:"Nanum Gothic Coding",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1319; --card:#18202a; --card2:#1f2833; --ink:#e7edf3; --ink2:#b3bfcc; --ink3:#8391a0;
  --line:#000000; --soft:#2d3845; --blue-bg:#1c2a4a; --yellow-bg:#3a3113; --green-bg:#15352a; --red-bg:#3d1f1c;
  --code-bg:#0a0e13; --blue:#5d86f0; --green:#3fb57a; --red:#f06a5c;
}}
:root[data-theme="dark"]{
  --ground:#0e1319; --card:#18202a; --card2:#1f2833; --ink:#e7edf3; --ink2:#b3bfcc; --ink3:#8391a0;
  --line:#000000; --soft:#2d3845; --blue-bg:#1c2a4a; --yellow-bg:#3a3113; --green-bg:#15352a; --red-bg:#3d1f1c;
  --code-bg:#0a0e13; --blue:#5d86f0; --green:#3fb57a; --red:#f06a5c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{margin:0;font:15.5px/1.75 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0 0 .8em}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
img{max-width:100%;display:block}
code{font-family:var(--mono);font-size:.92em;background:var(--card2);border:1px solid var(--soft);border-radius:5px;padding:0 5px}
kbd{font-family:var(--mono);font-size:.85em;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:5px;padding:0 6px;background:var(--card)}

/* 틀 */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:2px solid var(--line);padding:18px 16px 30px}
.main{min-width:0;padding-inline:28px;padding-block:0 60px}
.bricks{display:flex;gap:5px;margin-bottom:12px}
.bricks i{width:24px;height:15px;border:2px solid var(--line);border-radius:3px;display:block}
.bricks i:nth-child(1){background:var(--blue)}.bricks i:nth-child(2){background:var(--yellow)}
.bricks i:nth-child(3){background:var(--green)}.bricks i:nth-child(4){background:var(--red)}
.side .kicker{font:700 11px/1.4 var(--sans);letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.side h1{font:400 24px/1.25 var(--display);margin:4px 0 12px}
.side .links{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{border:1.5px solid var(--line);background:var(--blue-bg);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink)}
.side label.s{font-size:12.5px;color:var(--ink2);font-weight:600}
.side input[type=search]{width:100%;margin:4px 0 12px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font:14px var(--sans);background:var(--card2);color:var(--ink)}
.prog{font-size:12.5px;color:var(--ink2);font-weight:600;display:flex;justify-content:space-between}
.pbar{height:10px;border:1.5px solid var(--line);border-radius:6px;background:var(--card2);overflow:hidden;margin:4px 0 14px}
.pbar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.nav a{display:grid;grid-template-columns:30px 1fr 16px;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.35;border:1.5px solid transparent}
.nav a:hover{background:var(--card2)}
.nav a.on{background:var(--ink);color:var(--card)}
.nav .no{font:700 11px/1 var(--mono);border:1.5px solid currentColor;border-radius:5px;padding:4px 0;text-align:center}
.nav .ph{font-size:10.5px;display:block;color:var(--ink3);margin-top:8px;padding-left:8px;font-weight:700;letter-spacing:.05em}
.nav a.on .ok{color:var(--card)}
.nav .ok{color:var(--green);font-weight:700;text-align:center}
.btn.menu-btn{display:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:12px 0;background:var(--ground);border-bottom:2px solid var(--soft);margin-bottom:22px}
.top .crumb{margin-right:auto;font-size:13.5px;color:var(--ink2);font-weight:600}
.btn{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 13px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-sm);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.blue{background:var(--blue);color:#fff}.btn.yellow{background:var(--yellow);color:#141c26}
.btn.green{background:var(--green);color:#fff}
.btn small{font-weight:500;opacity:.8}

/* 첫 화면 */
.hero{background:var(--yellow);color:#141c26;border:2px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:30px 32px;position:relative;overflow:hidden}
.hero .tag{display:inline-block;background:#fff;border:2px solid #141c26;border-radius:7px;padding:1px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:14px}
.hero h2{font:400 clamp(30px,5vw,48px)/1.12 var(--display);margin-bottom:14px}
.hero p{max-width:600px;color:#2c2610}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.stats b{font:400 30px/1 var(--display);display:block}
.stats span{font-size:12.5px;font-weight:600}
.studs{position:absolute;right:26px;bottom:22px;display:grid;grid-template-columns:repeat(4,22px);gap:10px;opacity:.28}
.studs i{width:22px;height:22px;border-radius:50%;background:#141c26;display:block}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
.start{margin-top:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.pill{display:inline-block;border:1.5px solid var(--line);border-radius:7px;padding:0 9px;font-size:12px;font-weight:700;background:var(--yellow-bg)}
.start h3{font:400 26px/1.25 var(--display);margin:8px 0}
.start .acts{display:grid;gap:10px;justify-items:end}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.two h3{font-size:16px;margin-bottom:6px}
.two p{margin:0;color:var(--ink2);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}
.bcard{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-top-width:8px;border-radius:14px;box-shadow:var(--shadow);padding:14px 18px 16px}
.bcard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.bcard .no{font:700 11.5px var(--mono);letter-spacing:.06em}
.bcard h3{font:400 21px/1.3 var(--display);margin:4px 0 4px}
.bcard p{margin:0 0 10px;color:var(--ink2);font-size:14px}
.bcard .meta{font-size:12px;color:var(--ink3);font-weight:600}
.bcard .done{float:right;color:var(--green);font-weight:700;font-size:12px}
.c-blue{border-top-color:var(--blue)}.c-blue .no{color:var(--blue)}
.c-yellow{border-top-color:var(--yellow)}.c-yellow .no{color:#9a7400}
.c-green{border-top-color:var(--green)}.c-green .no{color:var(--green)}
.c-red{border-top-color:var(--red)}.c-red .no{color:var(--red)}
.phase-h{font:400 22px var(--display);margin:34px 0 -8px;display:flex;align-items:center;gap:10px}
.phase-h i{width:18px;height:18px;border:2px solid var(--line);border-radius:4px;display:inline-block}

/* 블록 */
.bhead{border:2px solid var(--line);border-radius:18px;box-shadow:6px 6px 0 var(--line);padding:24px 28px;color:#fff;background:var(--blue)}
.bhead.yellow{background:var(--yellow);color:#141c26}.bhead.green{background:var(--green)}.bhead.red{background:var(--red)}
.bhead .no{font:700 12.5px var(--mono);letter-spacing:.14em;opacity:.9}
.bhead h2{font:400 clamp(28px,4.4vw,40px)/1.2 var(--display);margin:8px 0}
.bhead p{margin:0;font-size:14.5px;opacity:.95}
.bbody{margin-top:22px}
.bbody h3{font:400 23px/1.3 var(--display);margin:28px 0 10px}
.bbody h3:first-child{margin-top:0}
.bbody h4{font-size:15.5px;margin:18px 0 6px}
.bbody ul,.bbody ol{padding-left:1.3em;margin:0 0 .9em}
.bbody li{margin-bottom:.35em}
.bbody .lead{font-size:16.5px}
.steps{counter-reset:st;list-style:none;padding:0!important}
.steps>li{position:relative;padding-left:44px;margin-bottom:14px!important}
.steps>li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:1px;width:30px;height:30px;border:2px solid var(--line);border-radius:8px;background:var(--yellow);color:#141c26;font:700 15px/26px var(--mono);text-align:center}
pre.cmd{position:relative;margin:10px 0 16px;background:var(--code-bg);color:var(--code-ink);border:2px solid var(--line);border-radius:12px;padding:40px 16px 14px;font:14px/1.65 var(--mono);overflow-x:auto;white-space:pre}
pre.cmd::before{content:attr(data-label);position:absolute;left:14px;top:10px;font:600 12px var(--sans);color:var(--code-dim)}
pre.cmd .copy{position:absolute;right:10px;top:7px;border:1.5px solid #3a4655;background:#1d2631;color:#e6edf3;border-radius:7px;font:600 12px var(--sans);padding:2px 10px}
pre.cmd .copy:hover{background:#2a3644}
pre.out{background:var(--card2);color:var(--ink);border:1.5px dashed var(--ink3);border-radius:10px;padding:12px 14px;font:13.5px/1.6 var(--mono);overflow-x:auto;white-space:pre;margin:8px 0 16px}
pre.cmd .c{color:#7fd19b}
.note{border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--blue-bg)}
.note b.t{display:block;margin-bottom:2px}
.note.warn{background:var(--red-bg)}.note.tip{background:var(--green-bg)}.note.why{background:var(--yellow-bg)}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.tbl{overflow-x:auto;margin:10px 0 16px;border:2px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;background:var(--card)}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
.tbl thead th{background:var(--card2);font-size:12.5px;color:var(--ink2)}
.tbl tr:last-child td{border-bottom:0}
.tbl td code{white-space:nowrap}
.shots h3{margin-top:30px}
.shotgrid{display:grid;gap:18px}
figure.shot{margin:0;background:var(--card);border:2px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
figure.shot button{display:block;width:100%;padding:0;border:0;background:#0c0c0c;cursor:zoom-in}
figure.shot img{width:100%;height:auto}
figure.shot figcaption{padding:10px 14px 12px;border-top:2px solid var(--line);font-size:14px;color:var(--ink2)}
figure.shot figcaption b{color:var(--blue);display:block;font-size:13px}
.illus{border:2px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;margin:12px 0 18px}
.illus .cap{padding:9px 14px;border-top:2px solid var(--line);font-size:13.5px;color:var(--ink2)}
.illus .cap b{color:var(--blue)}
.turn{border:2px solid var(--green);background:var(--green-bg);border-radius:14px;padding:16px 20px;margin-top:30px}
.turn h3{font:400 22px var(--display);margin:0 0 6px}
.turn label{display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:10px;cursor:pointer}
.turn input{width:20px;height:20px;accent-color:var(--green);margin-top:3px;flex:none}
.memo{margin-top:16px}
.memo label{font-size:13px;color:var(--ink2);font-weight:600}
.memo textarea{width:100%;min-height:90px;margin-top:4px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:14.5px/1.6 var(--sans);background:var(--card);color:var(--ink);resize:vertical}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.pn .btn{max-width:48%}
.foot{margin-top:40px;padding-top:14px;border-top:2px solid var(--soft);font-size:12.5px;color:var(--ink3)}
.all-sep{height:0;border-top:3px dashed var(--soft);margin:48px 0}

/* 그림 설명(재현) */
.win{font-family:"Segoe UI",var(--sans);font-size:13px;color:#1b1b1b;background:#f3f3f3}
.win .bar{display:flex;align-items:center;gap:8px;background:#fff;padding:8px 12px;border-bottom:1px solid #ddd;font-size:12.5px}
.win .bar i{width:14px;height:14px;background:#3776ab;border-radius:3px;display:inline-block}
.inst{display:grid;grid-template-columns:150px 1fr;min-height:250px}
.inst .l{background:linear-gradient(160deg,#3776ab,#ffd343);}
.inst .r{padding:18px 20px;background:#fff}
.inst h5{margin:0 0 6px;font-size:17px;font-weight:600;color:#1a1a1a}
.inst .opt{border:1px solid #bbb;border-radius:4px;padding:8px 10px;margin:10px 0;background:#fafafa}
.inst .opt b{color:#0b5cad}
.inst .chk{display:flex;align-items:center;gap:8px;margin-top:8px}
.inst .chk span{width:14px;height:14px;border:1px solid #555;display:inline-grid;place-items:center;font-size:11px;background:#fff}
.inst .chk.hl{outline:3px solid #dd4637;outline-offset:3px;border-radius:3px}
.drag{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:22px 20px;background:#fff}
.drag .it{display:grid;justify-items:center;gap:6px;font-size:13px}
.drag .ico{width:58px;height:46px;border-radius:5px;position:relative}
.drag .folder{background:#f8c34a;border:2px solid #c8961c}
.drag .folder::before{content:"";position:absolute;left:-2px;top:-9px;width:24px;height:9px;background:#f8c34a;border:2px solid #c8961c;border-bottom:0;border-radius:4px 4px 0 0}
.drag .cmdf{background:#2b2b2b;border:2px solid #111;color:#ddd;font:10px/44px var(--mono);text-align:center}
.drag .arrow{font:400 34px var(--display);color:#dd4637}

/* 사진 확대 */
.lb{position:fixed;inset:0;background:rgba(8,12,16,.86);z-index:60;display:grid;place-items:center;padding:24px}
.lb img{max-height:88vh;width:auto;max-width:96vw;border:2px solid #000;border-radius:8px;background:#000}
.lb .x{position:absolute;right:18px;top:14px;background:#fff;border:2px solid #000;border-radius:9px;padding:4px 12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);border-radius:10px;padding:8px 16px;font-size:14px;font-weight:600;z-index:70;border:2px solid var(--line)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:6px 0 0 var(--line)}
  .side.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  .main{padding-inline:16px}
  .two,.grid{grid-template-columns:1fr}
  .start{grid-template-columns:1fr}.start .acts{justify-items:start}
  .hero{padding:24px 20px}
  .studs{display:none}
  .pn .btn{max-width:100%}
  .inst{grid-template-columns:70px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="학습 목차">
    <div class="bricks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="kicker">파이썬 실습 교재</div>
    <h1>자료변환기<br>설치부터 변환까지</h1>
    <div class="links">
      <a class="chipbtn" href="#home">학습 지도</a>
      <a class="chipbtn" href="#all">전체 보기</a>
      <a class="chipbtn" href="https://github.com/legoschool/pkos-textbook" target="_blank" rel="noopener">GitHub 저장소 ↗</a>
    </div>
    <label class="s" for="q">학습 내용 찾기</label>
    <input type="search" id="q" placeholder="예: 설치, 자가진단, PATH, 개인정보" autocomplete="off">
    <div class="prog"><span>완료</span><span id="progTxt">0 / 15</span></div>
    <div class="pbar"><i id="progBar"></i></div>
    <ul class="nav" id="nav"></ul>
  </aside>

  <div class="main">
    <div class="top">
      <button class="btn menu-btn" id="menuBtn" aria-controls="side">☰ 목차</button>
      <span class="crumb" id="crumb">학습 지도</span>
      <button class="btn blue" data-dl="code">코드 받기 <small>zip</small></button>
      <button class="btn" data-dl="demo">실습 자료 받기 <small>zip</small></button>
      <button class="btn" id="exportBtn">학습 기록 내보내기</button>
    </div>
    <main id="view"></main>
    <div class="foot">
      화면 사진은 2026-09-17 Windows 11 · Python 3.14.7 에서 이 교재의 명령을 실제로 실행해 찍었습니다. 파일 탐색기의 왼쪽 탐색 창은 개인 폴더가 보여 가렸습니다.
      설치 화면·끌어다 놓기 그림은 설명을 위해 다시 그린 것입니다. 실습 자료의 이름·전화번호 등은 모두 지어낸 것입니다.
      자료변환기는 MIT 라이선스입니다. 체크와 메모는 이 브라우저에만 저장됩니다.
    </div>
  </div>
</div>
<div class="lb" id="lb" hidden><button class="x" id="lbX">닫기 Esc</button><img id="lbImg" alt=""></div>
<div class="toast" id="toast" hidden></div>

<script>
const PHASES = {
  "준비": {color: "blue", label: "준비 · 받고 이해하기"},
  "설치": {color: "yellow", label: "설치 · 파이썬과 라이브러리"},
  "변환": {color: "green", label: "변환 · 넣고 읽고 다시 돌리기"},
  "활용": {color: "red", label: "활용 · 지키고 넓히기"},
};

const BLOCKS = [
{id: "s00", no: "준비", phase: "준비", title: "코드와 실습 자료 받기",
 goal: "두 zip 을 받아 C:\\pkos_실습 에 풀고, 폴더 모양을 사진과 대조한다.",
 desc: "도구 코드와 예시 자료를 받아 알맞은 자리에 푼다.", meta: "화면 사진 1장",

<h3>파이썬이 없다면</h3>
<h4>방법 A · 설치.cmd 에게 맡기기 (가장 쉬움)</h4>
<p>3블록의 <code>설치.cmd</code> 를 더블클릭하면 파이썬이 없을 때 <code>Install Python now? (y/n)</code> 을 묻습니다. <kbd>y</kbd> <kbd>Enter</kbd> 를 누르면 winget 으로 Python 3.13 을 사용자 범위에 설치합니다. 끝나면 <b>창을 닫고 설치.cmd 를 한 번 더</b> 실행합니다.</p>
<h4>방법 B · 명령 한 줄</h4>
<pre class="cmd" data-label="명령 프롬프트 (설치.cmd 가 쓰는 것과 같은 명령)">winget install --id Python.Python.3.13 --source winget --scope user</pre>
<h4>방법 C · python.org 설치 파일</h4>
<ol class="steps">
<li><a href="https://www.python.org/downloads/" target="_blank" rel="noopener">python.org/downloads</a> 에서 Windows 용 설치 파일을 받아 실행합니다.</li>
<li><b>첫 화면 맨 아래 <code>Add python.exe to PATH</code> 를 반드시 체크</b>하고 <b>Install Now</b>.</li>
<li>설치가 끝나면 <b>명령 프롬프트를 닫았다가 새로 열고</b> <code>python --version</code> 을 다시 확인합니다.</li>
</ol>

<div class="opt"><b>→ Install Now</b><br><span style="color:#555">C:\Users\(사용자)\AppData\Local\Programs\Python\…</span></div>
<div class="chk"><span>✓</span>Use admin privileges when installing py.exe</div>
<div class="chk hl"><span>✓</span><b>Add python.exe to PATH</b></div>
</div></div></div>

<div class="note why"><b class="t">새 창이라야 찾습니다</b>
설치 직후 이미 열려 있던 명령 프롬프트는 새 PATH 를 모릅니다. 창을 닫고 다시 여세요.</div>
<div class="note"><b class="t">파이썬이 여러 개 깔린 PC</b>
<code>py -0p</code> 로 목록을 봅니다. 설치.cmd 와 변환하기.cmd 는 <b>명령창의 python</b> 을 먼저 쓰고, 라이브러리도 <code>python --version</code> 에 나온 그 파이썬에 깔립니다. 설치한 파이썬과 실행하는 파이썬이 다르면 "설치 필요" 오류가 납니다.</div>`},

{id: "s03", no: "03", phase: "설치", title: "라이브러리 설치하기",

<p class="lead">자료변환기는 PDF·워드·PPT 등을 읽으려고 파이썬 라이브러리 8개를 씁니다. 설치 전후를 <code>--점검</code> 으로 비교해 봅니다.</p>
<h3>1. 설치 전 점검</h3>
<pre class="cmd" data-label="명령 프롬프트">python pkos.py --점검</pre>
<div class="shotgrid"><figure class="shot" data-img="02_before_check" data-cap="사진 · 설치 전|✘ 가 빠진 라이브러리입니다. 이 PC 에는 openpyxl·olefile 만 있었습니다. 맨 아래에 '한 줄로 설치' 명령도 알려 줍니다."></figure></div>

<h3>2. 설치.cmd 더블클릭</h3>
<ol class="steps">
<li>파일 탐색기에서 <code>설치.cmd</code> 를 <b>더블클릭</b>합니다. (명령 프롬프트에서 <code>설치.cmd</code> 라고 입력해도 됩니다.)</li>
<li>파이썬을 찾으면 버전을 보여 주고 곧바로 라이브러리를 받습니다. 처음이면 인터넷 속도에 따라 1~5분 걸립니다.</li>
<li>파이썬이 없으면 <code>Install Python now? (y/n)</code> 을 묻습니다. 2블록의 방법 A 를 보세요.</li>
<li>마지막에 목록이 모두 ✔ 이고 <b>다 갖춰졌습니다.</b> 가 나오면 아무 키나 눌러 창을 닫습니다.</li>
</ol>
<div class="shotgrid"><figure class="shot" data-img="03_setup_done" data-cap="사진 · 설치 끝|Successfully installed … 아래로 8개가 모두 ✔. 이 PC 에서는 10초쯤 걸렸습니다."></figure></div>
<div class="note why"><b class="t">.cmd 파일이 영어로만 된 이유</b>
윈도우 배치 파일에 한글을 넣으면 명령창의 코드페이지(949/65001)에 따라 안내문 줄을 명령으로 실행해 버립니다. 그래서 한글 화면은 모두 <code>pkos.py</code> 가 그립니다. 코드를 고칠 때도 .cmd 에는 한글을 넣지 마세요.</div>

<h3>더블클릭 대신 명령으로</h3>
<pre class="cmd" data-label="설치.cmd 가 부르는 것과 같음">python pkos.py --설치</pre>
<pre class="cmd" data-label="또는 pip 로 직접">python -m pip install -r requirements.txt</pre>

<h3>무엇이 깔리나</h3>
<div class="tbl"><table><thead><tr><th>라이브러리</th><th>쓰임</th></tr></thead><tbody>
<tr><td><code>pymupdf</code></td><td>PDF 읽기, PDF 속 그림 꺼내기</td></tr>
<tr><td><code>python-docx</code></td><td>워드 .docx</td></tr>
<tr><td><code>python-pptx</code></td><td>파워포인트 .pptx</td></tr>
<tr><td><code>openpyxl</code></td><td>엑셀 .xlsx</td></tr>

<h3>코드 읽기 — 형식은 어떻게 알아내나</h3>
<p><code>engine/sniff.py</code> 는 세 단계로 판단합니다.</p>
<ol>
<li><b>매직 넘버</b> — 파일 맨 앞 몇 바이트. PDF 는 <code>%PDF</code>, PNG 는 <code>\x89PNG</code> 로 시작합니다.</li>
<li><b>껍데기 열어 보기</b> — docx·pptx·xlsx·hwpx 는 모두 ZIP 입니다. 안의 파일 목록으로 가릅니다. 옛 형식(.doc .xls .hwp)은 OLE 라는 껍데기라서 안의 저장소 이름을 봅니다.</li>
<li><b>글자파일</b> — UTF-8 → cp949 순서로 풀어 보고, HTML·JSON·자막처럼 구조가 뚜렷한지 봅니다.</li>
</ol>
<pre class="cmd" data-label="engine/sniff.py 일부">_MAGIC = [
    (0, b"%PDF",                    "pdf"),
    (0, b"\x89PNG\r\n\x1a\n",       "png"),
    (0, b"\xff\xd8\xff",            "jpeg"),
    # …
]

_ZIP_MARKERS = [
    ("word/document.xml",     "docx"),
    ("ppt/presentation.xml",  "pptx"),
    ("xl/workbook.xml",       "xlsx"),
    ("Contents/section0.xml", "hwpx"),
    # …
]</pre>
<h4>파이썬에서 직접 해 보기</h4>
<p>도구 폴더의 명령 프롬프트에서 <code>python</code> 만 입력하면 <code>&gt;&gt;&gt;</code> 가 나옵니다. 한 줄씩 입력하고, 끝낼 때는 <code>exit()</code>.</p>
<pre class="cmd" data-label="파이썬 대화형 창 (>>>)">from engine import sniff
k = sniff(r"..\흩어진자료\확장자없는발표")
print(k.label, k.why)</pre>
<pre class="out">파워포인트 내용(ZIP 안에 ppt/presentation.xml)</pre>
<div class="note"><b class="t">r"…" 는 무엇?</b>
윈도우 경로의 <code>\</code> 를 글자 그대로 쓰라는 표시(raw string)입니다. 빼면 <code>\n</code> 같은 조합이 줄바꿈으로 바뀌어 경로가 깨질 수 있습니다.</div>`},

      <p>학습 목표 · ${esc(b.goal)}</p>
    </header>
    <div class="bbody card">${b.body}</div>
    <section class="turn">
      <h3>내 차례</h3>
      <label for="done-${b.id}"><input type="checkbox" id="done-${b.id}" data-done="${b.id}" ${state.done[b.id] ? "checked" : ""}><span>${esc(b.turn)}</span></label>
    </section>
    <div class="memo"><label for="memo-${b.id}">내 메모 · 오류 문장이나 확인한 결과를 적습니다 (이 브라우저에만 저장)</label>
      <textarea id="memo-${b.id}" data-memo="${b.id}" placeholder="예: python --version → Python 3.14.7">${esc(state.memo[b.id] || "")}</textarea></div>
    ${nav}
  </article>`;
}

function enhance(root) {
  $$("figure.shot[data-img]", root).forEach(f => {
    const [t, d] = (f.dataset.cap || "").split("|");
    const src = IMG[f.dataset.img];
    if (!src) return;
    f.innerHTML = `<button type="button" aria-label="${esc(t)} 크게 보기"><img src="${src}" alt="${esc(t + " — " + (d || ""))}" loading="lazy"></button>
      <figcaption><b>${esc(t)}</b>${esc(d || "")}</figcaption>`;
    f.querySelector("button").addEventListener("click", () => openLb(src, t));
  });
  $$("pre.cmd", root).forEach(p => {
    if (p.querySelector(".copy")) return;
    const text = p.textContent.replace(/^\n/, "");
    const btn = document.createElement("button");
    btn.className = "copy"; btn.type = "button"; btn.textContent = "복사";
    btn.addEventListener("click", () => copyText(text, btn));
    p.appendChild(btn);
  });
}

function route() {
  const id = location.hash.slice(1) || "home";
  const view = $("#view");
  const b = BLOCKS.find(x => x.id === id);
  if (b) {
    view.innerHTML = blockHTML(b, true);
    $("#crumb").textContent = `BLOCK ${blockNo(b)} · ${b.title}`;
  } else if (id === "all") {
    view.innerHTML = BLOCKS.map(x => blockHTML(x, false)).join('<div class="all-sep"></div>');
    $("#crumb").textContent = "전체 보기";
  } else {
    view.innerHTML = renderHome();
    $("#crumb").textContent = "학습 지도";
  }
  enhance(view);
  markNav();
  $("#side").classList.remove("open");
  window.scrollTo(0, 0);
}

/* ── 저장 · 입력 ──────────────────────────────── */
document.addEventListener("change", e => {
  const id = e.target.dataset && e.target.dataset.done;
  if (!id) return;
  state.done[id] = e.target.checked; save();
  renderProgress(); renderNav($("#q").value);
  if (e.target.checked) toast("완료로 표시했습니다");
});
let memoTimer;
document.addEventListener("input", e => {
  const id = e.target.dataset && e.target.dataset.memo;
  if (!id) return;
  state.memo[id] = e.target.value;
  clearTimeout(memoTimer); memoTimer = setTimeout(save, 400);
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
$("#menuBtn").addEventListener("click", () => $("#side").classList.toggle("open"));
$("#nav").addEventListener("click", e => { if (e.target.closest("a")) $("#side").classList.remove("open"); });

/* ── 복사 ─────────────────────────────────────── */
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    ta.remove();
  }
  btn.textContent = ok ? "복사됨" : "직접 선택해 복사";
  setTimeout(() => { btn.textContent = "복사"; }, 1600);
}

/* ── 사진 확대 ────────────────────────────────── */
function openLb(src, alt) { $("#lbImg").src = src; $("#lbImg").alt = alt; $("#lb").hidden = false; $("#lbX").focus(); }
function closeLb() { $("#lb").hidden = true; $("#lbImg").src = ""; }
$("#lb").addEventListener("click", e => { if (e.target.id !== "lbImg") closeLb(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lb").hidden) closeLb(); });

/* ── 내려받기 ─────────────────────────────────── */
function b64ToBlob(b64) {
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr]);
}
let dlApi;
const dlReady = (window.claude && window.claude.use) ? window.claude.use("downloads").then(x => (dlApi = x)).catch(() => null) : Promise.resolve(null);
async function offer(filename, data) {
  await dlReady;
  if (dlApi) {
    try { await dlApi.save({filename, data}); toast("저장했습니다"); }
    catch (e) {
      if (e && e.code === "declined") toast("저장을 취소했습니다");
      else if (e && e.code === "rate_limited") toast("이미 저장 창이 열려 있습니다");
      else toast("이 화면에서는 저장할 수 없습니다");
    }
    return;
  }
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type: "text/markdown"}));
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-dl]");
  if (!b) return;
  const f = FILES[b.dataset.dl];
  if (f.url) {                       // 웹 게시판 — 같은 사이트의 파일을 그대로 받는다
    const a = document.createElement("a");
    a.href = f.url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    if (inFrame) toast("받기가 시작되지 않으면 오른쪽 위 '새 창' 에서 받으세요");
    return;
  }
  offer(f.name, b64ToBlob(f.b64));
});

// 구글 사이트처럼 다른 페이지 안에 끼워 넣었을 때 — 새 창으로 여는 단추
let inFrame = false;
try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
if (inFrame && /^https?:/.test(location.protocol)) {
  const a = document.createElement("a");
  a.className = "btn"; a.href = location.href.split("#")[0]; a.target = "_blank"; a.rel = "noopener";
  a.textContent = "새 창 ↗";
  $(".top").appendChild(a);
}
$("#exportBtn").addEventListener("click", () => {
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const n = BLOCKS.filter(b => state.done[b.id]).length;
  const L = [`# 자료변환기 실습 기록`, ``, `- 내보낸 날: ${stamp}`, `- 완료: ${n} / ${BLOCKS.length}`, ``];
  for (const b of BLOCKS) {
    L.push(`## ${state.done[b.id] ? "[x]" : "[ ]"} BLOCK ${blockNo(b)} · ${b.title}`, ``, `- 확인: ${b.turn}`);
    const m = (state.memo[b.id] || "").trim();
    L.push(m ? `- 메모:\n\n${m.split("\n").map(x => "    " + x).join("\n")}` : `- 메모: (없음)`, ``);
  }
  offer(`자료변환기_학습기록_${stamp}.md`, L.join("\n"));
});

window.addEventListener("hashchange", route);
renderNav(); renderProgress(); route();

</script>
</body>
</html>
